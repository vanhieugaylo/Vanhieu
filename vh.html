<<!DOCTYPE html>
<html lang="vi">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Liên kết tệp CSS chính xác -->
    <link rel="stylesheet" href="vh.css">
</head>
<body>
    <!-- Liên kết "Chuyển đến Nội dung chính" hoạt động -->
    <a href="#main-content" class="skip-link">Chuyển đến Nội dung chính</a>

    <header>
        <nav>
            <ul>
                <li><a href="#">Trang chủ</a></li>
                <li><a href="#">Công viên</a></li>
                <li><a href="#">Liên hệ</a></li>
            </ul>
            <!-- Hình ảnh trong điều hướng -->
            <img src="anh1.PNG" alt="Logo trang web">

        <section class="grid">
            <div class="grid-item">
                <img src="anh1.PNG" alt="Cảnh quan công viên 1">

            <div class="grid-item">
                <img src="anh1.PNG" alt="Cảnh quan công viên 2">
                <p>Mô tả thông tin về công viên thứ hai.</p>
            </div>
        </section>

        <!-- Phần lớp linh hoạt (Flex) -->
        <section class="flex">
            <div class="flex-item">
                <img src="anh1.PNG" alt="Hình ảnh flex 1">
            </div>
            <div class="flex-item">
                <img src="anh1.PNG" alt="Hình ảnh flex 2">
